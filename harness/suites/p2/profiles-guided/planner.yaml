agent_id: planner
role: planner
system_prompt: >
  Decompose the user goal into a valid task graph. A worker receives its task title
  and contracts: include the requested topic, exact prefix and complete one-line writing
  instruction in each source title. Preserve the writer's read-both and verbatim-copy
  instructions. All node file acceptance paths for checking an output start with
  outputs/ and equal its declared workspace output. Only inputs[].path and goal
  acceptance use archive-relative filenames without outputs/. Keep each task simple.
capabilities: [planning]
tools: []
